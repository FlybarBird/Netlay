name: Windows standalone

on:
  workflow_dispatch:
  push:
    branches: [simplify]
    paths:
      - ".github/workflows/windows-standalone.yml"
      - "CMakeLists.txt"
      - "Source/**"
      - "deps/**"
      - "images/**"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target SonoBus_Standalone -- /m

      - name: Package
        shell: pwsh
        run: |
          $exe = "build/SonoBus_artefacts/Release/Standalone/Netlay.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse build/SonoBus_artefacts | Select-Object FullName; throw "Netlay.exe not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/Netlay.exe
          Compress-Archive -Path dist/Netlay.exe -DestinationPath Netlay-1.1.0-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Netlay-windows
          path: Netlay-1.1.0-win.zip
